<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランダムリダイレクト</title>
    <script>
        // 遷移先のURLリスト
        const urls = [
            'https://k47miura-ss-wq.github.io/game1/game.%E9%BB%92%E5%86%86%E5%8D%98%E7%99%BA%E6%BC%94%E5%87%BA/', // リンクAのURL
            'https://k47miura-ss-wq.github.io/game2/game.%E9%BB%92%E5%86%86%E5%8D%98%E7%99%BA%E9%AB%98%E9%80%9F%E6%BC%94%E5%87%BA/', // リンクBのURL
            'https://k47miura-ss-wq.github.io/game3/game.%E9%BB%92%E7%81%B0%E5%86%86%E5%A4%9A%E9%87%8D%E6%BC%94%E5%87%BA/',  // リンクCのURL
            'https://k47miura-ss-wq.github.io/game4/game.%E9%BB%92%E7%81%B0%E5%86%86%E5%A4%9A%E9%87%8D%E9%AB%98%E9%80%9F%E6%BC%94%E5%87%BA/'
        ];

        // ページ読み込み時にランダムなURLへ遷移
        window.addEventListener('DOMContentLoaded', () => {
            const randomIndex = Math.floor(Math.random() * urls.length);
            window.location.href = urls[randomIndex];
        });
    </script>
</head>
<body>
    <p>ページを移動しています...</p>
</body>
</html>
