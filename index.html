<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランダムリダイレクト</title>
    <script>
        // 遷移先のURLリスト
        const urls = [
            'https://k47miura-ss-wq.github.io/game1/', // リンクAのURL
            'https://k47miura-ss-wq.github.io/game2/', // リンクBのURL
            'https://k47miura-ss-wq.github.io/game3',  // リンクCのURL
            'https://k47miura-ss-wq.github.io/game4'
        ];

        // ページ読み込み時にランダムなURLへ遷移
        window.addEventListener('DOMContentLoaded', () => {
            const randomIndex = Math.floor(Math.random() * urls.length);
            window.location.href = urls[randomIndex];
        });
    </script>
</head>
<body>
    <p>ページを移動しています...</p>
</body>
</html>
